<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" fill="none" aria-label="AnyStop Dynamic Sweep Logo">
  <defs>
    <linearGradient id="dynPinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B5E"/>
      <stop offset="100%" stop-color="#FF473B"/>
    </linearGradient>
    <linearGradient id="dynRoadGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFA019"/>
      <stop offset="100%" stop-color="#FFC033"/>
    </linearGradient>
  </defs>

  <!-- Speed Streaks on the Right of Pin -->
  <g fill="#FF5A4E" opacity="0.95">
    <path d="M 220 86 L 278 86 C 280 86 280 89 278 89 L 220 89 Z"/>
    <path d="M 220 98 L 294 98 C 296 98 296 102 294 102 L 220 102 Z"/>
    <path d="M 220 112 L 310 112 C 313 112 313 117 310 117 L 220 117 Z"/>
    <path d="M 220 128 L 298 128 C 300 128 300 133 298 133 L 220 133 Z"/>
    <path d="M 220 144 L 272 144 C 274 144 274 148 272 148 L 220 148 Z"/>
  </g>

  <!-- Dynamic Sweeping Road (Bottom Left to Pin) -->
  <path d="M 40 250 C 70 246 104 228 134 196 C 160 168 184 136 214 122 C 200 160 162 216 110 248 C 90 260 64 266 40 268 Z" fill="url(#dynRoadGrad)"/>

  <!-- Sweeping Road Dashed Center Markings -->
  <path d="M 62 251 C 82 245 99 232 116 218" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 16" fill="none"/>
  <path d="M 124 210 C 145 190 166 164 186 142" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 14" fill="none"/>

  <!-- Location Pin -->
  <g transform="translate(140, 40)">
    <path d="M 70 140 C 44 116 16 88 16 54 A 54 54 0 1 1 124 54 C 124 88 96 116 70 140 Z" fill="url(#dynPinGrad)"/>

    <!-- Bus Silhouette -->
    <rect x="42" y="30" width="56" height="66" rx="14" fill="#1F1A3F"/>
    <rect x="50" y="38" width="40" height="20" rx="5" fill="#FF5A4E"/>
    <circle cx="53" cy="76" r="4" fill="#FF5A4E"/>
    <circle cx="87" cy="76" r="4" fill="#FF5A4E"/>
    <rect x="62" y="79" width="16" height="3" rx="1.5" fill="#FF5A4E"/>
  </g>

  <!-- Typography Stacked on Bottom Right -->
  <g font-family="'Bricolage Grotesque', 'Figtree', sans-serif" font-weight="800">
    <text x="210" y="210" font-size="44" fill="#FFA726">Any</text>
    <text x="210" y="258" font-size="48" fill="#FFFFFF">Stop</text>
  </g>

  <!-- Sparkle Stars -->
  <path d="M 292 268 Q 292 278 302 278 Q 292 278 292 288 Q 292 278 282 278 Q 292 278 292 268 Z" fill="#8E8AA8" opacity="0.75"/>
</svg>
