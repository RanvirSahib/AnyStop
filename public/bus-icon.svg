<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" aria-label="AnyStop App Icon">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28224E"/>
      <stop offset="100%" stop-color="#181433"/>
    </linearGradient>

    <!-- Pin Gradient -->
    <linearGradient id="appPinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B5E"/>
      <stop offset="100%" stop-color="#FF473B"/>
    </linearGradient>

    <!-- Road Gradient -->
    <linearGradient id="appRoadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB326"/>
      <stop offset="100%" stop-color="#FF9615"/>
    </linearGradient>

    <!-- Subtle Radial Glow behind Pin -->
    <radialGradient id="pinGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#FF5A4E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF5A4E" stop-opacity="0"/>
    </radialGradient>

    <!-- App Icon Drop Shadow -->
    <filter id="appShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle App Container -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="122" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Radial Glow -->
  <circle cx="256" cy="245" r="180" fill="url(#pinGlow)"/>

  <!-- ICON ELEMENTS -->
  <!-- Outer Signal Waves (Flanking App Squircle / Outer) -->
  <path d="M 124 168 A 120 120 0 0 0 124 322" stroke="#FFA726" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M 154 195 A 80 80 0 0 0 154 295" stroke="#FF5A4E" stroke-width="16" stroke-linecap="round" fill="none"/>

  <path d="M 358 195 A 80 80 0 0 1 358 295" stroke="#FF5A4E" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M 388 168 A 120 120 0 0 1 388 322" stroke="#FFA726" stroke-width="18" stroke-linecap="round" fill="none"/>

  <!-- Central Location Pin Mark -->
  <g filter="url(#appShadow)">
    <!-- Location Pin Body -->
    <path d="M 256 376 C 218 318 152 258 152 184 A 104 104 0 1 1 360 184 C 360 258 294 318 256 376 Z" fill="url(#appPinGrad)"/>

    <!-- Bus Silhouette (Dark Navy inside Pin) -->
    <rect x="200" y="124" width="112" height="132" rx="28" fill="#1F1A3F"/>

    <!-- Bus Windshield Cutout -->
    <rect x="216" y="144" width="80" height="40" rx="10" fill="#FF5A4E"/>

    <!-- Bus Headlights -->
    <circle cx="224" cy="220" r="8.5" fill="#FF5A4E"/>
    <circle cx="288" cy="220" r="8.5" fill="#FF5A4E"/>

    <!-- Bus Grille Bar -->
    <rect x="240" y="226" width="32" height="7" rx="3.5" fill="#FF5A4E"/>

    <!-- Road Shaped as Letter 'A' -->
    <path d="M 238 240 L 274 240 L 312 388 L 280 388 L 268 338 L 244 338 L 232 388 L 200 388 Z" fill="url(#appRoadGrad)"/>

    <!-- 'A' Inner Top Hole -->
    <polygon points="256,260 242,310 270,310" fill="#1F1A3F"/>

    <!-- 'A' Lower Highway Cutout -->
    <polygon points="256,338 244,388 268,388" fill="#1F1A3F"/>

    <!-- Road Center Dashed Line -->
    <line x1="256" y1="274" x2="256" y2="304" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <line x1="256" y1="318" x2="256" y2="334" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <line x1="256" y1="348" x2="256" y2="378" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Sparkle Star on Lower Right of Pin -->
  <path d="M 336 348 Q 336 362 350 362 Q 336 362 336 376 Q 336 362 322 362 Q 336 362 336 348 Z" fill="#8E8AA8" opacity="0.65"/>
</svg>
