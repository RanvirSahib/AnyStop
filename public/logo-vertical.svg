<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" fill="none" aria-label="AnyStop Vertical Logo">
  <defs>
    <!-- Coral Pin Gradient -->
    <linearGradient id="vPinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B5E"/>
      <stop offset="100%" stop-color="#FF4B3E"/>
    </linearGradient>

    <!-- Amber Road Gradient -->
    <linearGradient id="vRoadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB326"/>
      <stop offset="100%" stop-color="#FF981A"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="vShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ICON MARK (Top Centered at X=150) -->
  <g transform="translate(150, 80) scale(1.6)" filter="url(#vShadow)">
    <g transform="translate(-48, -44)">
      <!-- Broadcast Waves (Left) -->
      <path d="M 23 23 A 28 28 0 0 0 23 51" stroke="#FFA726" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.95"/>
      <path d="M 29 28 A 18 18 0 0 0 29 46" stroke="#FF5A4E" stroke-width="3.2" stroke-linecap="round" fill="none"/>

      <!-- Broadcast Waves (Right) -->
      <path d="M 67 28 A 18 18 0 0 1 67 46" stroke="#FF5A4E" stroke-width="3.2" stroke-linecap="round" fill="none"/>
      <path d="M 73 23 A 28 28 0 0 1 73 51" stroke="#FFA726" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.95"/>

      <!-- Location Pin Body -->
      <path d="M 48 64 C 41 53 28 41 28 26 A 20 20 0 1 1 68 26 C 68 41 55 53 48 64 Z" fill="url(#vPinGrad)"/>

      <!-- Bus Silhouette (Dark Navy inside Pin) -->
      <rect x="37" y="14" width="22" height="26" rx="5.5" fill="#1F1A3F"/>

      <!-- Bus Windshield Cutout -->
      <rect x="40.5" y="18" width="15" height="7.5" rx="2" fill="#FF5A4E"/>

      <!-- Bus Headlights -->
      <circle cx="41.5" cy="32.5" r="1.6" fill="#FF5A4E"/>
      <circle cx="54.5" cy="32.5" r="1.6" fill="#FF5A4E"/>

      <!-- Bus Grille Bar -->
      <rect x="45" y="33.5" width="6" height="1.4" rx="0.7" fill="#FF5A4E"/>

      <!-- Road Shaped as Letter 'A' -->
      <path d="M 44.5 37 L 51.5 37 L 59 66 L 52.5 66 L 50 56 L 46 56 L 43.5 66 L 37 66 Z" fill="url(#vRoadGrad)"/>

      <!-- 'A' Inner Top Hole -->
      <polygon points="48,41 45.2,50.5 50.8,50.5" fill="#1F1A3F"/>

      <!-- 'A' Lower Highway Cutout -->
      <polygon points="48,56 46,66 50,66" fill="#1F1A3F"/>

      <!-- Road Center Dashed Line -->
      <line x1="48" y1="44" x2="48" y2="49" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="48" y1="52" x2="48" y2="55" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="48" y1="58" x2="48" y2="64" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- STACKED TYPOGRAPHY -->
  <g font-family="'Bricolage Grotesque', 'Figtree', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="-1">
    <!-- "Any" in Golden Amber -->
    <text x="150" y="210" font-size="52" fill="#FFA726">Any</text>
    <!-- "Stop" in Pure White -->
    <text x="150" y="268" font-size="56" fill="#FFFFFF">Stop</text>
  </g>

  <!-- Dual Sparkle Stars on the Right -->
  <!-- Upper sparkle -->
  <path d="M 230 196 Q 230 203 237 203 Q 230 203 230 210 Q 230 203 223 203 Q 230 203 230 196 Z" fill="#8E8AA8" opacity="0.6"/>
  <!-- Lower larger sparkle -->
  <path d="M 244 246 Q 244 256 254 256 Q 244 256 244 266 Q 244 256 234 256 Q 244 256 244 246 Z" fill="#8E8AA8" opacity="0.75"/>
</svg>
